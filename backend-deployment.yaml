apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-backend
  labels:
    app: todo-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todo-backend
  template:
    metadata:
      labels:
        app: todo-backend
    spec:
      containers:
        - name: todo-backend
          image: <YOUR_ECR_REPO>/todo-backend:v1.0.0
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: APP_VERSION
              value: "v1.0.0"
            - name: APP_COLOR
              value: "#4F46E5"
            - name: APP_COLOR_NAME
              value: "indigo"
            - name: CORS_ORIGIN
              value: "*"     # tighten to your frontend's Ingress host in a real setup
          readinessProbe:
            httpGet: { path: /ready, port: 5000 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: todo-backend
  labels:
    app: todo-backend
    release: kube-prometheus-stack   # matches typical serviceMonitorSelector; adjust to yours
spec:
  selector:
    app: todo-backend
  ports:
    - name: http
      port: 80
      targetPort: 5000
  type: ClusterIP
