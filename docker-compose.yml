version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      APP_VERSION: v1.0.0
      APP_COLOR: "#4F46E5"
      APP_COLOR_NAME: indigo
      CORS_ORIGIN: "*"

  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    environment:
      BACKEND_URL: http://localhost:5000
      FRONTEND_VERSION: v1.0.0
      FRONTEND_COLOR: "#4F46E5"
      FRONTEND_COLOR_NAME: indigo
    depends_on:
      - backend
