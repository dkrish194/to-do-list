apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-frontend-v2
  labels:
    app: todo-frontend
    version: v2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todo-frontend
      version: v2
  template:
    metadata:
      labels:
        app: todo-frontend
        version: v2
    spec:
      containers:
        - name: todo-frontend
          image: <YOUR_ECR_REPO>/todo-frontend:v2.0.0
          ports:
            - containerPort: 8080
          env:
            - name: FRONTEND_VERSION
              value: "v2.0.0"
            - name: FRONTEND_COLOR
              value: "#059669"
            - name: FRONTEND_COLOR_NAME
              value: "green"
            - name: BACKEND_URL
              value: "https://api.your-domain.example"
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10

# Practice ideas (same pattern as the backend, now with a visible UI):
#  - Rolling update: bump image tag on todo-frontend-v1, watch the banner
#    color/version change as `kubectl rollout status` progresses
#  - Blue/Green: apply this alongside v1, then flip the Service selector
#    from `version: v1` to `version: v2` for an instant cutover
#  - Canary: scale v1 to 4 replicas, v2 to 1 (same Service selects both via
#    `app: todo-frontend`) to send ~20% of browser traffic to green
