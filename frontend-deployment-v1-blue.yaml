apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-frontend-v1
  labels:
    app: todo-frontend
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todo-frontend
      version: v1
  template:
    metadata:
      labels:
        app: todo-frontend
        version: v1
    spec:
      containers:
        - name: todo-frontend
          image: <YOUR_ECR_REPO>/todo-frontend:v1.0.0
          ports:
            - containerPort: 8080
          env:
            - name: FRONTEND_VERSION
              value: "v1.0.0"
            - name: FRONTEND_COLOR
              value: "#4F46E5"
            - name: FRONTEND_COLOR_NAME
              value: "indigo"
            # Browser calls this URL directly, so it must be reachable from
            # OUTSIDE the cluster - your Ingress/ALB host for todo-backend,
            # not the internal ClusterIP DNS name.
            - name: BACKEND_URL
              value: "https://api.your-domain.example"
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: todo-frontend
  labels:
    app: todo-frontend
spec:
  selector:
    app: todo-frontend   # no version selector -> routes to whichever version is live
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
