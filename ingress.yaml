apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-app
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: todo-backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: todo-frontend
                port:
                  number: 80

# If you route the backend under the same ALB at /api, set the frontend's
# BACKEND_URL env var to that same ALB hostname + /api (no separate host
# needed, and no CORS issue since it's same-origin). Simpler than running
# frontend and backend on different hostnames.
