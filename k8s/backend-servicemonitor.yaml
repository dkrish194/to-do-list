# Adjust `release: kube-prometheus-stack` (both here and on the Service label)
# to match whatever value your Prometheus CR's serviceMonitorSelector expects.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: todo-backend
  labels:
    app: todo-backend
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: todo-backend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
