# MySQL as a single instance (Deployment, not StatefulSet) is fine for a
# learning/lab environment. For real production HA you'd use a StatefulSet
# with replication (or a managed service like RDS) - noted here so you know
# this is a deliberate simplification, not an oversight.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  labels:
    app: mysql
spec:
  replicas: 1
  strategy:
    type: Recreate   # never run 2 MySQL pods against the same PVC at once
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: mysql-credentials, key: MYSQL_ROOT_PASSWORD } }
            - name: MYSQL_DATABASE
              valueFrom: { secretKeyRef: { name: mysql-credentials, key: MYSQL_DATABASE } }
            - name: MYSQL_USER
              valueFrom: { secretKeyRef: { name: mysql-credentials, key: MYSQL_USER } }
            - name: MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: mysql-credentials, key: MYSQL_PASSWORD } }
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
            - name: custom-cnf
              mountPath: /etc/mysql/conf.d/custom.cnf
              subPath: custom.cnf
            - name: mysql-logs
              mountPath: /var/log/mysql
          readinessProbe:
            exec: { command: ["mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$(MYSQL_ROOT_PASSWORD)"] }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$(MYSQL_ROOT_PASSWORD)"] }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }

        # Sidecar: ships MySQL's slow/error/general logs to container stdout
        # so Filebeat/Fluent-bit (which typically only reads stdout) can
        # pick them up without extra host-path configuration.
        - name: log-shipper
          image: busybox:1.36
          command: ["sh", "-c", "touch /var/log/mysql/slow.log /var/log/mysql/error.log && tail -F /var/log/mysql/slow.log /var/log/mysql/error.log"]
          volumeMounts:
            - name: mysql-logs
              mountPath: /var/log/mysql
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits: { cpu: "50m", memory: "32Mi" }

      volumes:
        - name: data
          persistentVolumeClaim: { claimName: mysql-data }
        - name: init-scripts
          configMap: { name: mysql-init, items: [{ key: init.sql, path: init.sql }] }
        - name: custom-cnf
          configMap: { name: mysql-init, items: [{ key: custom.cnf, path: custom.cnf }] }
        - name: mysql-logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels:
    app: mysql
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
  type: ClusterIP
