apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-backend
  labels:
    app: todo-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todo-backend
  template:
    metadata:
      labels:
        app: todo-backend
    spec:
      # Waits for MySQL's TCP port to accept connections before the main
      # container even starts - avoids the CrashLoopBackOff pattern seen
      # earlier. The app itself also retries internally (belt and braces),
      # but this keeps the very first startup clean and fast to diagnose.
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z mysql 3306; do
                echo "waiting for mysql..."
                sleep 2
              done
              echo "mysql is accepting connections"
      containers:
        - name: todo-backend
          image: dkrish194/todo-backend:v2.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: APP_VERSION
              value: "v1.0.0"
            - name: APP_COLOR
              value: "#4F46E5"
            - name: APP_COLOR_NAME
              value: "indigo"
            - name: CORS_ORIGIN
              value: "*"
            - name: DB_HOST
              value: "mysql"
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: mysql-credentials, key: MYSQL_DATABASE } }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: mysql-credentials, key: MYSQL_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: mysql-credentials, key: MYSQL_PASSWORD } }
          # LIVENESS: process-only check (see /health in app.py) - never
          # restarts the pod just because MySQL is briefly unreachable.
          livenessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          # READINESS: actually checks DB connectivity - pulls the pod out
          # of the Service's endpoint list if MySQL is down, without killing it.
          readinessProbe:
            httpGet: { path: /ready, port: 5000 }
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          # Resource requests are REQUIRED for HPA to calculate CPU
          # utilization percentage - without these, HPA can't compute a
          # target and will show <unknown> for current metrics.
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: todo-backend
  labels:
    app: todo-backend
    release: kube-prometheus-stack   # match your ServiceMonitor selector
spec:
  selector:
    app: todo-backend
  ports:
    - name: http
      port: 80
      targetPort: 5000
  type: ClusterIP
